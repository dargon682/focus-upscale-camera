apply plugin: 'com.android.application'

android {
    namespace 'com.photo.tool'
    compileSdk 36

    signingConfigs {
        dargon {
            storeFile file('../keystores/dargon.keystore')
            storePassword 'DargonKeyStore2026'
            keyAlias 'dargon'
            keyPassword 'DargonKeyStore2026'
        }
    }

    defaultConfig {
        applicationId 'com.photo.tool'
        minSdkVersion 24
        // 目标系统降至 Android 13 (API 33)，扩大机型兼容范围
        targetSdkVersion 33
        versionCode 18
        versionName "0.8.11"
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            // 统一使用 Dargon 签名：相同签名 + 更高 versionCode 即可覆盖安装
            signingConfig signingConfigs.dargon
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // 调试包同样统一为 Dargon 签名，保证覆盖升级不残留不同签名
            signingConfig signingConfigs.dargon
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.core:core:1.17.0"
    implementation "androidx.lifecycle:lifecycle-runtime:2.8.7"

    // CameraX
    implementation "androidx.camera:camera-core:1.4.1"
    implementation "androidx.camera:camera-camera2:1.4.1"
    implementation "androidx.camera:camera-lifecycle:1.4.1"
    implementation "androidx.camera:camera-view:1.4.1"
}